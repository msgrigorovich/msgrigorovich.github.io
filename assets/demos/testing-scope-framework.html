</style></head><body><main class="app">
<header class="topbar"><div><h1>Testing Scope Framework</h1><p class="intro">Impact defines how broadly to test. Complexity defines how deeply. <a href="https://github.com/msgrigorovich/TestingScopeFramework" target="_blank" rel="noopener noreferrer">Read the methodology</a></p></div><div class="result" aria-live="polite"><div class="result-pill" id="resultPill"></div><div class="result-copy"><div class="result-meta" id="resultMeta"></div><div class="formula" id="formulaDetails"></div></div></div></header>
<section class="controls" aria-label="Calculator inputs"><div class="primary-controls"><div class="field"><label for="impact">Impact</label><select id="impact"><option>XS</option><option selected>S</option><option>M</option><option>L</option><option>XL</option></select></div><div class="field"><label for="complexity">Complexity</label><select id="complexity"><option>XS</option><option>S</option><option selected>M</option><option>L</option><option>XL</option></select></div><div class="field component"><label for="component">qalab testing surface</label><select id="component"><option value="Experiment">Reaction Experiment</option><option value="Interaction">Player Interaction</option><option value="TestStand">Test Stand</option><option value="Regression">Regression Analysis</option><option value="Telemetry">Telemetry Export</option></select></div></div><div class="weight-controls"><div class="field"><label for="impactWeight">Impact weight</label><input id="impactWeight" type="number" min="0" max="1" step=".01" value="0.60"></div><div class="field"><label for="complexityWeight">Complexity weight</label><input id="complexityWeight" type="number" min="0" max="1" step=".01" value="0.40"></div></div></section>
<div class="level-bar" id="levelBar" aria-label="Calculated testing levels"></div><section class="cards" id="cards"></section>
<section class="checklist-panel"><div class="checklist-heading"><h2>Checklist to copy</h2><span class="checklist-context" id="checklistContext"></span></div><button class="copy-button" id="copyButton">Copy checklist for Jira</button><div class="checklist-items" id="checklistItems"></div><div class="checklist-note">Weights are normalized to 1. The score is rounded up as a safety margin.</div><textarea id="jiraOutput" aria-hidden="true"></textarea></section>
</main><script>
const values={XS:1,S:2,M:3,L:4,XL:5},levels=['XS','S','M','L','XL'],colors={XS:'var(--xs)',S:'var(--s)',M:'var(--m)',L:'var(--l)',XL:'var(--xl)'};
const levelData={
XS:{name:'Minimal Validation',short:'Minimal',goal:'Confirm the local change',scope:'The changed behavior only',inherits:'',checks:['Meets the task requirement','Main expected scenario works','No behavior outside the change is explored'],example:'Safety lock blocks StartExperiment; with the lock off, the experiment still starts.'},
S:{name:'Basic Validation',short:'Basic',goal:'Check simple logic and deviations',scope:'The change and its immediate surroundings',inherits:'Everything from XS, plus:',checks:['Simple negative scenarios','Obvious boundary values','Nearby behavior using the same logic'],example:'A fixed maximum temperature rejects hotter reactions, while the exact boundary remains valid.'},
M:{name:'Deep Validation',short:'Deep',goal:'Verify the complete mechanic',scope:'All states and scenarios inside the mechanic',inherits:'Everything from S, plus:',checks:['Calculations and dependencies','Meaningful input combinations','State transitions and data consistency'],example:'The safe temperature now depends on the A/B ratio; verify combinations, boundaries and experiment states.'},
L:{name:'System Validation',short:'System',goal:'Verify connected systems',scope:'The mechanic and adjacent systems',inherits:'Everything from M, plus:',checks:['Impact on connected modules','Regression of adjacent workflows','System-to-system data flow'],example:'Threshold failures must flow through the Test Stand and appear correctly in regression FailureRate.'},
XL:{name:'Critical Validation',short:'Critical',goal:'Challenge the whole affected area',scope:'Cross-system and cross-domain regression',inherits:'Everything from L, plus:',checks:['Unusual and extreme scenarios','Full affected-scope regression','Performance and cross-team checks'],example:'Make threshold drift release-blocking without breaking telemetry, anchor tests, interaction or sweep performance.'}};
const componentChecks={Experiment:{label:'Reaction Experiment',items:['Missing reagents fail for the right reason','Minimum and maximum documented temperatures are accepted','Duplicate starts do not change the current result','Preview and real evaluation return the same values']},Interaction:{label:'Player Interaction',items:['Interaction works inside the allowed range','Interaction is rejected outside the range','One successful interaction is counted exactly once']},TestStand:{label:'Test Stand',items:['A sweep creates the expected configurations and runs','Only the selected parameter changes','Repeated runs of one configuration are deterministic']},Regression:{label:'Regression Analysis',items:['Summary statistics match known sample data','A deliberate regression flags only the affected metric','Too few runs produce an inconclusive report']},Telemetry:{label:'Telemetry Export',items:['Run and scenario IDs are correct','CSV and JSON contain one record per run','Completed and failed results use the expected values']}};
const $=id=>document.getElementById(id),impact=$('impact'),complexity=$('complexity'),component=$('component'),impactWeight=$('impactWeight'),complexityWeight=$('complexityWeight'),cards=$('cards'),levelBar=$('levelBar'),resultPill=$('resultPill'),resultMeta=$('resultMeta'),formulaDetails=$('formulaDetails'),jiraOutput=$('jiraOutput'),copyButton=$('copyButton'),checklistItems=$('checklistItems'),checklistContext=$('checklistContext');let previewLevel=null;
function weights(){let a=Math.max(0,Math.min(1,Number(impactWeight.value)||0)),b=Math.max(0,Math.min(1,Number(complexityWeight.value)||0)),sum=a+b;return sum?[a/sum,b/sum]:[.6,.4]}
function selection(){const[a,b]=weights(),score=a*values[impact.value]+b*values[complexity.value];return{score,level:levels[Math.ceil(score)-1],a,b}}
function render(){const s=selection(),surface=componentChecks[component.value],shown=previewLevel||s.level,d=levelData[shown];resultPill.textContent=`${s.level} – ${levelData[s.level].name}`;resultPill.style.background=colors[s.level];resultMeta.textContent=`Impact ${impact.value} · Complexity ${complexity.value}`;formulaDetails.textContent=`${s.a.toFixed(2)}×${values[impact.value]} + ${s.b.toFixed(2)}×${values[complexity.value]} = ${s.score.toFixed(2)} → ${s.level}`;levelBar.innerHTML=levels.map(l=>`<button type="button" data-preview-level="${l}" aria-pressed="${l===shown}" class="level-button ${l===shown?'active':''} ${l===s.level?'calculated':''}" style="--level:${colors[l]};${l===shown?'background:'+colors[l]:''}">${l}<span>${levelData[l].short}</span></button>`).join('');cards.innerHTML=`<article class="level-card active" style="--level:${colors[shown]}"><header class="card-head"><div class="card-title"><span class="card-code">${shown}</span><span class="card-name">${d.name}</span></div><div class="card-goal">${d.goal}</div></header><div class="card-body"><div class="scope"><strong>Scope:</strong> ${d.scope}</div><div class="inherits ${d.inherits?'':'empty'}">${d.inherits||'No inherited checks'}</div><div class="checks">${d.checks.map(x=>`<div class="check">${x}</div>`).join('')}</div><div class="example"><b>Reaction Experiment:</b> ${d.example}</div></div></article>`;const list=[...levelData[s.level].checks,...surface.items];checklistContext.textContent=`${s.level} – ${levelData[s.level].name} · ${surface.label}`;checklistItems.innerHTML=list.map(x=>`<div class="checklist-item">${x}</div>`).join('');jiraOutput.value=`||Testing Level||${s.level} – ${levelData[s.level].name}||\n||Testing surface||${surface.label}||\n||Status||Pending review||\n${list.map((x,i)=>`|${i+1}. ${x}|☐ Pending|`).join('\n')}`}
function notifyParent(){const[a,b]=weights();window.parent.postMessage({type:'scope-framework-change',impact:impact.value,complexity:complexity.value,impactWeight:a,complexityWeight:b},window.location.origin)}function normalize(){const[a,b]=weights();impactWeight.value=a.toFixed(2);complexityWeight.value=b.toFixed(2);previewLevel=null;render();notifyParent()}[impact,complexity].forEach(x=>x.addEventListener('change',()=>{previewLevel=null;render();notifyParent()}));component.addEventListener('change',render);[impactWeight,complexityWeight].forEach(x=>{x.addEventListener('input',()=>{previewLevel=null;render();notifyParent()});x.addEventListener('change',normalize)});levelBar.addEventListener('click',event=>{const button=event.target.closest('[data-preview-level]');if(!button)return;impact.value=button.dataset.previewLevel;complexity.value=button.dataset.previewLevel;previewLevel=null;render();notifyParent()});window.addEventListener('message',event=>{if(event.origin!==window.location.origin||event.data?.type!=='scope-state-sync')return;const state=event.data;if(levels.includes(state.impact))impact.value=state.impact;if(levels.includes(state.complexity))complexity.value=state.complexity;if(Number.isFinite(Number(state.impactWeight)))impactWeight.value=Number(state.impactWeight).toFixed(2);if(Number.isFinite(Number(state.complexityWeight)))complexityWeight.value=Number(state.complexityWeight).toFixed(2);previewLevel=null;render()});copyButton.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(jiraOutput.value)}catch{jiraOutput.select();document.execCommand('copy')}copyButton.textContent='Copied';setTimeout(()=>copyButton.textContent='Copy checklist for Jira',1200)});render();
</script></body></html>
