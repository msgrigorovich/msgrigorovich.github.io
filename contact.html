<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact — Diana Grigorovich</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="contact-page">
  <header>
    <a href="/" class="logo">
      <span class="dot"></span>
      <strong>Diana Grigorovich</strong>
    </a>
    <nav class="top-nav">
      <a href="resume">Resume</a>
      <span class="divider"></span>
      <a href="projects">Projects</a>
      <span class="divider"></span>
      <a href="contact">Contact</a>
    </nav>
  </header>

  <main>
    <div class="circle contact" aria-current="page">Contact</div>
  </main>

  <main class="contact-layout">
    <div class="contact-text">
      <p>I will be glad to receive your message :)</p>
    </div>

    <form class="contact-form" id="contactForm">
      <div class="form-row">
        <input type="text" name="first_name" placeholder="First Name" required />
        <input type="text" name="last_name" placeholder="Last Name" required />
      </div>
      <input type="email" name="email" placeholder="Your Email" required />
      <input type="text" name="subject" placeholder="Subject" />
      <textarea name="message" placeholder="Message" rows="5" required></textarea>
      <button type="submit">Submit</button>
    
      <img src="/assets/images/branding/best-regards.png" alt="Best regards Diana Grigorovich" class="signature best_regards"/>
    
      <p id="formSuccess" style="display:none; color: green; font-weight: bold; text-align: center; margin-top: 1rem;">
        Thank you! Your message has been sent.
      </p>

    </form>
  </main>

  <footer>
    <div class="footer-grid">
      <div>
        <p><strong>Email</strong><br />
            <a href="mailto:me@dianagrigorovich.com">me@dianagrigorovich.com</a>
        </p>
      </div>
      <div class="social">
        <p><strong>Follow Me</strong></p>
        <div class="icons">
          <a href="https://www.linkedin.com/in/diana-grigorovich/" target="_blank">
            <img src="/linkedin_icon.png" alt="LinkedIn" class="social-icon">
          </a>
          <a href="https://github.com/msgrigorovich" target="_blank">
            <img src="/github_icon.png" alt="GitHub" class="social-icon github-icon">
          </a>
        </div>
      </div>
      <div class="copy">
        © 2026 By Diana Grigorovich
      </div>
    </div>
  </footer>

<div class="cursor-dot"></div>
<div class="cursor-outline">
  <div class="cursor-outline-inner"></div>
</div>
<canvas class="cursor-trail"></canvas>


<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script src="/assets/js/main.js"></script>
<script src="/assets/js/analytics.js"></script>

</body>
</html>
