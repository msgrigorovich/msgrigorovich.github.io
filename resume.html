<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resume – Diana Grigorovich</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="prefetch" as="image" href="/assets/images/portraits/albert-einstein-2015.webp" fetchpriority="low">
  <link rel="prefetch" as="script" href="/assets/js/projects.min.js?v=d7e958b3be">
  <link rel="stylesheet" href="/assets/css/style.min.css?v=a8edf5b31f" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Source+Code+Pro&display=swap" rel="stylesheet">

</head>
<body class="resume-page">
  <header>
    <a href="/" class="logo">
      <span class="dot"></span>
      <strong>Diana Grigorovich</strong>
    </a>
    <nav class="top-nav">
      <a href="resume">Resume</a>
      <span class="divider"></span>
      <a href="projects">Projects</a>
      <span class="divider"></span>
      <a href="contact">Contact</a>
    </nav>
  </header>

  <main class="resume-main">
    <div class="circle resume" aria-current="page">Resume</div>
    <p class="resume-hint">scroll / click / ↑ ↓</p>

    <section class="resume-explorer" aria-label="Resume timeline">
      <div class="resume-year-wheel" id="resumeYearWheel" tabindex="0" aria-label="Select a role">
        <div class="resume-year-list" id="resumeYearList"></div>
      </div>

      <article class="resume-card" id="resumeCard" aria-live="polite"></article>

      <aside class="resume-project-rail" id="resumeProjectRail" aria-label="Company and project links"></aside>
    </section>

    <nav class="resume-tabs" aria-label="Resume sections">
      <button class="resume-tab active" type="button" data-resume-tab="experience">Experience</button>
      <button class="resume-tab" type="button" data-resume-tab="skills">Skills</button>
      <button class="resume-tab" type="button" data-resume-tab="education">Education</button>
    </nav>
  </main>

  <dialog class="resume-modal" id="resumeModal" aria-labelledby="resumeModalTitle">
    <div class="resume-modal-header">
      <div>
        <p class="resume-eyebrow" id="resumeModalEyebrow"></p>
        <h2 id="resumeModalTitle"></h2>
        <p class="resume-modal-role" id="resumeModalRole"></p>
      </div>
      <button class="resume-modal-close" id="resumeModalClose" type="button" aria-label="Close details">×</button>
    </div>
    <div class="resume-modal-content" id="resumeModalContent"></div>
  </dialog>

  <footer>
    <div class="footer-grid">
      <div>
        <p><strong>Email</strong><br />
            <a href="mailto:me@dianagrigorovich.com">me@dianagrigorovich.com</a>
        </p>
      </div>
      <div class="social">
        <p><strong>Follow Me</strong></p>
        <div class="icons">
          <a href="https://www.linkedin.com/in/diana-grigorovich/" target="_blank">
            <img src="/linkedin_icon.png" width="512" height="512" alt="LinkedIn" class="social-icon">
          </a>
          <a href="https://github.com/msgrigorovich" target="_blank">
            <img src="/github_icon.png" width="512" height="512" alt="GitHub" class="social-icon github-icon">
          </a>
        </div>
      </div>
      <div class="copy">
        © 2026 By Diana Grigorovich
      </div>
    </div>
  </footer>

<div class="cursor-dot"></div>
<div class="cursor-outline">
  <div class="cursor-outline-inner"></div>
</div>
<canvas class="cursor-trail"></canvas>


<script src="/assets/js/main.min.js?v=a0ff4d79d7"></script>
<script src="/assets/js/resume.min.js?v=2ef7a73b64"></script>
<script src="/assets/js/analytics.min.js?v=12d8eb6909"></script>

</body>
</html>
